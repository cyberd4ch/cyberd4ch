<svg fill="#f7f6f3" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title"><title>cyber.dach</title>
  <title id="title">cyber.dach — orbit d: celestial bowl, mast rising through the orbit ring</title>
  <g fill="none" stroke="#f7f6f3" stroke-width="20">
    <!-- celestial bowl (the d bowl) -->
    <circle cx="128" cy="135" r="44"/>
    <!-- orbit ring: one sweep, open at one o'clock where the mast rises through -->
    <path d="M 205.1 101.7 A 84 84 0 1 1 123 51.1"/>
    <!-- mast / stem rising through the orbit -->
    <path d="M 172 179 L 172 27"/>
  </g>
</svg>

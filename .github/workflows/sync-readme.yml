name: Sync profile README

on:
  schedule:
    # hourly, so the profile follows GitHub within the hour
    - cron: "37 * * * *"
  workflow_dispatch:
  # the site deploy wakes this sync right after each push (see nextjs.yml)
  repository_dispatch:
    types: [blog-updated]

permissions:
  contents: write

concurrency:
  group: sync-readme
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Regenerate from the latest main, commit, and push. A push rejected because
      # another sync landed first is retried from a fresh checkout of main.
      - name: Regenerate, commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git pull --rebase -q origin main
            node scripts/generate-cards.mjs
            node scripts/sync-readme.mjs
            if git diff --quiet README.md assets; then
              echo "README and cards already current"
              exit 0
            fi
            git add README.md assets
            git commit -q -m "Sync profile README from GitHub"
            if git push -q origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected on attempt $attempt, retrying from main"
            git fetch -q origin
            git reset -q --hard origin/main
            sleep $((attempt * 10))
          done
          echo "push kept losing the race" >&2
          exit 1

      # a broken link fails the run, so it cannot sit unnoticed in the profile
      - name: Check every README link
        run: node scripts/check-links.mjs README.md

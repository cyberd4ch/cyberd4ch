name: Sync profile README

on:
  schedule:
    # hourly, so the profile follows GitHub within the hour
    - cron: "37 * * * *"
  workflow_dispatch:
  # the site deploy wakes this sync right after each push (see nextjs.yml)
  repository_dispatch:
    types: [blog-updated]

permissions:
  contents: write

concurrency:
  group: sync-readme
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Render scoreboard cards
        run: node scripts/generate-cards.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate README blocks
        run: node scripts/sync-readme.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          if git diff --quiet README.md assets; then
            echo "README and cards already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md assets
            git commit -m "Sync profile README from GitHub"
            git push
          fi

      # a broken link fails the run, so it cannot sit unnoticed in the profile
      - name: Check every README link
        run: node scripts/check-links.mjs README.md
